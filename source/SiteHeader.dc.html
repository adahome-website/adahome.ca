<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header · shared</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.sh-dd a:hover{background:#2A2925}.sh-ddbtn{font-family:inherit}@media (min-width:1181px) and (hover:hover){.sh-ddwrap:hover .sh-dd,.sh-ddwrap:focus-within .sh-dd{display:flex!important}}@media (max-width:1180px){.sh-main{display:grid!important;grid-template-columns:auto 1fr;align-items:center;gap:12px 8px!important}.sh-burger{display:inline-flex!important;grid-column:1;grid-row:1}.sh-btns{grid-column:2;grid-row:1;justify-self:end;min-width:0}.sh-links{display:none!important;grid-column:1 / -1;grid-row:2;width:100%}.sh-links.sh-open{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:0!important;border-top:1px solid #2A2925;padding-top:8px!important}.sh-links.sh-open a,.sh-links.sh-open .sh-ddbtn{font-size:16px!important}.sh-links.sh-open .sh-dd{display:flex!important;position:static!important;border:0!important;background:transparent!important;padding:0 0 0 16px!important;min-width:0!important;box-shadow:none!important}.sh-links.sh-open .sh-ddbtn svg{display:none}}@media (max-width:600px){.sh-main{padding:12px 16px!important}.sh-btns{gap:8px!important}.sh-cta{padding:0 16px!important;font-size:13px!important}.sh-calltxt{display:none}.sh-call{padding:0 13px!important}}</style>
</helmet>
<div style="font-family: 'Montserrat', system-ui, sans-serif; color: #F4EFE6; background: #0D0D0D; width: 100%; line-height: 1.6">
<div style="background: #0D0D0D; border-bottom: 1px solid #2A2925"><nav aria-label="{{t.langLabel}}" style="max-width: 1240px; margin: 0 auto; padding: 6px 24px; display: flex; justify-content: flex-end; gap: 4px"><sc-for list="{{langs}}" as="lg" hint-placeholder-count="3"><a href="{{lg.href}}" lang="{{lg.code}}" hreflang="{{lg.code}}" title="{{lg.full}}" aria-current="{{lg.cur}}" style="min-height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-decoration: none; background: {{lg.bg}}; color: {{lg.color}}">{{lg.label}}</a></sc-for></nav></div>
<header style="background: #0D0D0D">
<nav class="sh-main" aria-label="{{t.mainLabel}}" style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<button type="button" class="sh-burger" aria-expanded="{{menu.open}}" aria-controls="sh-links" aria-label="{{menu.label}}" onClick="{{menu.toggle}}" style="display: none; width: 44px; height: 44px; align-items: center; justify-content: center; padding: 0; border: 1px solid #F4EFE6; border-radius: 999px; background: transparent; color: #F4EFE6; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{menu.icon}}"></path></svg></button>
<ul id="sh-links" class="sh-links {{menu.cls}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px"><sc-for list="{{nav}}" as="n" hint-placeholder-count="6"><li class="sh-ddwrap" style="position: relative"><sc-if value="{{n.plain}}" hint-placeholder-val="true"><a href="{{n.href}}" aria-current="{{n.cur}}" style="min-height: 44px; display: inline-flex; align-items: center; color: {{n.color}}; font-weight: {{n.weight}}; font-size: 14px; white-space: nowrap; text-decoration: {{n.deco}}; text-decoration-thickness: 1px; text-underline-offset: 8px">{{n.label}}</a></sc-if><sc-if value="{{n.group}}" hint-placeholder-val="false"><button type="button" class="sh-ddbtn" aria-expanded="{{n.open}}" aria-haspopup="true" onClick="{{n.toggle}}" style="font-family: inherit; line-height: inherit; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; cursor: pointer; color: {{n.color}}; font-weight: {{n.weight}}; font-size: 14px; white-space: nowrap; text-decoration: {{n.deco}}; text-decoration-thickness: 1px; text-underline-offset: 8px">{{n.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><div class="sh-dd" style="display: {{n.ddDisplay}}; position: absolute; top: 100%; left: -14px; z-index: 50; flex-direction: column; min-width: 210px; padding: 8px; border: 1px solid #2A2925; border-radius: 16px; background: #0D0D0D; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35)"><sc-for list="{{n.kids}}" as="k" hint-placeholder-count="2"><a href="{{k.href}}" aria-current="{{k.cur}}" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; color: {{k.color}}; font-weight: {{k.weight}}; font-size: 14px; white-space: nowrap; text-decoration: none">{{k.label}}</a></sc-for></div></sc-if></li></sc-for></ul>
<div class="sh-btns" style="display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 12px">
<a href="tel:+14034641595" class="sh-call" aria-label="{{t.callAria}}" style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border: 1px solid #F4EFE6; border-radius: 999px; color: #F4EFE6; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg><span class="sh-calltxt">{{t.call}}</span></a>
<a href="{{ctaHref}}" class="sh-cta" style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; background: #F4EFE6; color: #0D0D0D; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap">{{t.cta}}</a>
</div>
</nav>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","options":["en","fr","tr"],"default":"en"},"page":{"editor":"enum","options":["Gallery-tjka-th8q","Listings","Listing","About","Steps","Selling","Newcomers","Stats","Calculator","Privacy"],"default":"Gallery-tjka-th8q"},"ctaTarget":{"editor":"enum","options":["contact","home"],"default":"contact"},"$preview":{"width":1440,"height":124}}'>
class Component extends DCLogic {
  renderVals() {
    // Shared header for every page. Edit layout or styling here once and every page in every language updates.
    const lang = this.props.language || 'en';
    const page = this.props.page || 'Gallery-tjka-th8q';
    const TXT = {
      en: { nav: ['Home', 'Buying & selling', 'Listings', 'About me', 'Newcomers', 'Market & tools'], kids: ['Monthly stats', 'Calculators'], call: '(403) 464-1595', callAria: 'Call Ada at (403) 464-1595', cta: 'Private consultation', langLabel: 'Language', mainLabel: 'Main', menu: 'Open menu', close: 'Close menu' },
      fr: { nav: ['Accueil', 'Acheter et vendre', 'Propriétés', 'À propos', 'Nouveaux arrivants', 'Marché et outils'], kids: ['Statistiques mensuelles', 'Calculatrices'], call: '403 464-1595', callAria: 'Appeler Ada au 403 464-1595', cta: 'Consultation privée', langLabel: 'Langue', mainLabel: 'Principal', menu: 'Ouvrir le menu', close: 'Fermer le menu' },
      tr: { nav: ['Ana sayfa', 'Alım ve satım', 'İlanlar', 'Hakkımda', 'Yeni gelenler', 'Piyasa ve araçlar'], kids: ['Aylık istatistikler', 'Hesaplayıcılar'], call: '(403) 464-1595', callAria: "Ada'yı arayın: (403) 464-1595", cta: 'Özel görüşme', langLabel: 'Dil', mainLabel: 'Ana menü', menu: 'Menüyü aç', close: 'Menüyü kapat' }
    };
    const t = TXT[lang] || TXT.en;
    const file = (base, l) => base + (l === 'en' ? '' : '-' + l) + '.dc.html';
    const PAGES = ['Gallery-tjka-th8q', 'Steps', 'Listings', 'About', 'Newcomers', 'TOOLS'];
    const KIDS = ['Stats', 'Calculator'];
    // Every single-listing page (Listing, Listing-<street>) highlights Listings.
    const active = page === 'Selling' ? 'Steps' : (page === 'Listing' || page.indexOf('Listing-') === 0) ? 'Listings' : page;
    const mo = !!(this.state && this.state.menuOpen);
    const dd = !!(this.state && this.state.ddOpen);
    const look = (on) => ({ color: on ? '#F4EFE6' : '#C9BFAE', weight: on ? 600 : 500, deco: on ? 'underline' : 'none' });
    return {
      t,
      menu: { open: mo ? 'true' : 'false', cls: mo ? 'sh-open' : '', label: mo ? t.close : t.menu, icon: mo ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16', toggle: () => this.setState({ menuOpen: !mo }) },
      langs: [['en', 'EN', 'English'], ['fr', 'FR', 'Français'], ['tr', 'TR', 'Türkçe']].map(([code, label, full]) => ({
        code, label, full, href: file(page, code), cur: code === lang ? 'true' : 'false',
        bg: code === lang ? '#F4EFE6' : 'transparent', color: code === lang ? '#0D0D0D' : '#C9BFAE'
      })),
      nav: PAGES.map((p, i) => {
        if (p === 'TOOLS') {
          // "Market & tools" opens a small menu with Monthly stats and Calculators (hover or click on desktop; listed inline in the phone menu).
          const on = KIDS.includes(active);
          return Object.assign({ label: t.nav[i], plain: false, group: true, open: dd ? 'true' : 'false', ddDisplay: dd ? 'flex' : 'none', toggle: () => this.setState({ ddOpen: !dd }), href: '', cur: 'false',
            kids: KIDS.map((k, j) => Object.assign({ label: t.kids[j], href: file(k, lang), cur: k === active ? 'page' : 'false' }, look(k === active))) }, look(on));
        }
        const on = p === active;
        return Object.assign({ label: t.nav[i], plain: true, group: false, href: file(p, lang), cur: on ? 'page' : 'false', kids: [] }, look(on));
      }),
      // Pages without their own contact form (listings, privacy) send the button to the home page's contact form.
      ctaHref: (this.props.ctaTarget === 'home' || active === 'Listings' || page === 'Privacy') ? file('Gallery-tjka-th8q', lang) + '#contact' : '#contact'
    };
  }
}
</script>
</body>
</html>
